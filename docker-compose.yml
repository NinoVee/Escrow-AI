# Local infrastructure for EscrowFlow development. Not a production deployment.
#   docker compose up -d                 # postgres, redis, minio
#   docker compose --profile clamav up -d   # also start ClamAV (large image)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escrowflow
      POSTGRES_PASSWORD: escrowflow
      POSTGRES_DB: escrowflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrowflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: escrowflow
      MINIO_ROOT_PASSWORD: escrowflow-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Creates the private documents bucket (no anonymous access).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 escrowflow escrowflow-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/escrowflow-documents;
      mc anonymous set none local/escrowflow-documents;
      "

  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    ports: ["3310:3310"]

volumes:
  pgdata:
  redisdata:
  miniodata:
